name: All tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, "codex/**"]

jobs:
  bsd-reference:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install local reference test dependencies
        run: python -m pip install -e . pytest
      - name: Compare with macOS wc
        run: |
          if python -m pytest -q tests/test_bsd_contract.py tests/test_local_reference.py > bsd-test.log 2>&1; then
            cat bsd-test.log
          else
            cat bsd-test.log
            python -c 'import sys; print("::error title=macOS wc reference failure::" + sys.stdin.read()[-6000:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))' < bsd-test.log
            exit 1
          fi

  build:

    runs-on: ubuntu-latest
    strategy:
      # You can use PyPy versions in python-version.
      # For example, pypy2.7 and pypy3.9
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build dev environment
        run: make dev
      - name: Unit tests
        run: |
          if make test > unit-test.log 2>&1; then
            cat unit-test.log
          else
            cat unit-test.log
            python -c 'import sys; print("::error title=Ubuntu test failure::" + sys.stdin.read()[-6000:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))' < unit-test.log
            exit 1
          fi
